---
# Variables for local.yml. Edit this file, commit, and the next ansible-pull
# run picks up the changes - the playbook itself doesn't need to be touched.

# The user account to create.
admin_user: automation

# The group that grants sudo access. This is "sudo" on Debian and Ubuntu,
# and "wheel" on Fedora, RHEL, openSUSE and Arch.
admin_group: sudo

# Packages to install and keep updated.
packages:
  - curl
  - git
  - tmux
  - vim
  - wget

# System timezone. Run "timedatectl list-timezones" to see the valid values.
system_timezone: Etc/UTC

# Service to make sure is running.
managed_service: ssh

# The repository this playbook lives in.
ansible_pull_repo: "https://github.com/LearnLinuxTV/ansible-pull-test"
